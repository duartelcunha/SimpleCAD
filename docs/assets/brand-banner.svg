<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <!-- Background Field: Obsidian Mate -->
  <rect width="1200" height="320" rx="14" fill="#0D0E10"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="13.5" stroke="#25272E" stroke-width="1"/>

  <!-- Subtle Architectural Drafting Grid -->
  <g stroke="#181A20" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="840" y1="0" x2="840" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Swiss Registration Ticks -->
  <g stroke="#383B45" stroke-width="1">
    <line x1="32" y1="28" x2="46" y2="28"/>
    <line x1="32" y1="28" x2="32" y2="42"/>
    <line x1="1154" y1="28" x2="1168" y2="28"/>
    <line x1="1168" y1="28" x2="1168" y2="42"/>
    <line x1="32" y1="292" x2="46" y2="292"/>
    <line x1="32" y1="278" x2="32" y2="292"/>
    <line x1="1154" y1="292" x2="1168" y2="292"/>
    <line x1="1168" y1="278" x2="1168" y2="292"/>
  </g>

  <!-- Brand Mark: 04 Folded Screen -->
  <g transform="translate(88, 96)">
    <rect width="128" height="128" rx="26" fill="#121316"/>
    <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="25.25" stroke="#25272E" stroke-width="1.5"/>
    <polygon points="28,42 46,31 46,87 28,98" fill="#EDEAE4"/>
    <polygon points="48,31 64,41 64,97 48,87" fill="#5D5B55"/>
    <polygon points="66,41 82,31 82,87 66,97" fill="#EDEAE4"/>
    <polygon points="84,31 100,41 100,97 84,87" fill="#C8A96E"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="152" fill="#EDEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.03em">SimpleCAD</text>
  <text x="258" y="190" fill="#9A9891" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.01em">Offline 2D &amp; 3D Architectural Floorplan, Furniture &amp; Cable Routing Studio</text>

  <!-- Technical Spec Callout Strip (Right Aligned Drafting Notation) -->
  <line x1="258" y1="218" x2="780" y2="218" stroke="#25272E" stroke-width="1"/>
  <rect x="258" y="217" width="48" height="2" fill="#C8A96E"/>

  <text x="258" y="246" fill="#6E6C66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.06em">2D SAT ENGINE</text>
  <text x="392" y="246" fill="#6E6C66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.06em">•</text>
  <text x="414" y="246" fill="#6E6C66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.06em">ISOMETRIC 3D ORBIT</text>
  <text x="582" y="246" fill="#6E6C66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.06em">•</text>
  <text x="604" y="246" fill="#6E6C66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.06em">WIN32 WEBVIEW2 (~1.4 MB)</text>

  <!-- Right Minimalist Elevation Schematic -->
  <g transform="translate(886, 78)" stroke="#2E313A" stroke-width="1.2">
    <rect x="0" y="0" width="224" height="164" fill="#121316"/>
    <!-- Architectural plan partition hint inside right plate -->
    <line x1="0" y1="54" x2="98" y2="54" stroke="#25272E"/>
    <line x1="138" y1="0" x2="138" y2="112" stroke="#25272E"/>
    <rect x="22" y="88" width="92" height="54" fill="#17181C" stroke="#383B45"/>
    <!-- Articulated folded screen in technical wireframe + brass wing -->
    <polygon points="154,48 168,38 168,84 154,94" fill="#1E2027" stroke="#5D5B55"/>
    <polygon points="170,38 184,48 184,94 170,84" fill="#18191F" stroke="#5D5B55"/>
    <polygon points="186,48 200,38 200,84 186,94" fill="#C8A96E" fill-opacity="0.22" stroke="#C8A96E"/>
    <!-- Dimension caliper ticks -->
    <line x1="0" y1="-12" x2="224" y2="-12" stroke="#383B45" stroke-width="1"/>
    <line x1="0" y1="-16" x2="0" y2="-8" stroke="#C8A96E" stroke-width="1.2"/>
    <line x1="224" y1="-16" x2="224" y2="-8" stroke="#C8A96E" stroke-width="1.2"/>
    <text x="112" y="-17" text-anchor="middle" fill="#9A9891" stroke="none" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10">360 CM</text>
  </g>
</svg>
