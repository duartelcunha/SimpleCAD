[package]
name = "simplecad"
version = "1.0.0"
edition = "2021"
description = "SimpleCAD — Estúdio CAD 2D & 3D Offline para Plantas de Interiores"

[dependencies]
# The host is Windows-only. Wry's default features add unused GTK dependencies.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.0", default-features = false }

[build-dependencies]
tauri-winres = "0.3.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
